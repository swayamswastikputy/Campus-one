<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><meta name="description" content="CampusOne — unified digital campus management platform">
<title>CampusOne | Login</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand login-brand"><div class="brand-mark">C</div><div><strong>CampusOne</strong><span>Unified campus platform</span></div></div>
    <div class="login-heading"><h1>Welcome back</h1><p>Sign in to access your campus services.</p></div>
    <form id="loginForm" novalidate>
      <label>Institutional email<input id="loginEmail" type="email" autocomplete="username" placeholder="Enter your institutional email" required></label>
      <label>Password<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">Show</button></div></label>
      <div class="login-row"><label class="remember"><input id="rememberMe" type="checkbox"> Remember me</label><button type="button" class="link-btn" id="forgotPassword">Forgot password?</button></div>
      <p id="loginError" class="login-error" role="alert"></p>
      <button class="primary-btn login-btn" type="submit">Sign in</button>
    </form>
    <p class="login-note">No demo account, default email, or default password is configured.</p>
  </div>
</div>
<div id="app" hidden>
<div id="offlineBar" class="offline-bar">Offline mode · Cached campus data is available</div>
<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">C</div><div><strong>CampusOne</strong><span>Unified campus platform</span></div></div><div class="role-card"><span class="eyebrow">CURRENT ROLE</span><div class="role-row"><span id="roleLabel">Student</span><button class="tiny-btn" id="roleToggle">Switch</button></div></div><nav id="mainNav" aria-label="Main navigation"><button class="nav-item active" data-page="home">⌂ <span>Dashboard</span></button><button class="nav-item" data-page="attendance">◷ <span>Attendance</span></button><button class="nav-item" data-page="timetable">▦ <span>Timetable</span></button><button class="nav-item" data-page="requests">✓ <span>Requests & Passes</span></button><button class="nav-item" data-page="certificates">▤ <span>Certificates</span></button><button class="nav-item" data-page="hostel">⌂ <span>Hostel & Complaints</span></button><button class="nav-item" data-page="mess">◉ <span>Mess Services</span></button><button class="nav-item" data-page="notices">! <span>Notices</span></button><button class="nav-item" data-page="fees">₹ <span>Fees & Queries</span></button><button class="nav-item admin-only" data-page="admin">▥ <span>Admin Console</span></button></nav><div class="sidebar-bottom"><button class="nav-item" id="languageBtn">文 <span>Language</span><b id="langLabel">EN</b></button><button class="nav-item" id="offlineBtn">⇩ <span>Offline pack</span></button><button class="nav-item" id="logoutBtn">↪ <span>Sign out</span></button></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="search"><span>⌕</span><input id="globalSearch" placeholder="Search notices, services, requests..."></div><div class="top-actions"><button class="icon-btn" id="notifBtn">♢<i></i></button><button class="profile" id="profileBtn"><span class="avatar" id="profileAvatar">U</span><span><strong id="profileName">User</strong><small id="profileMeta">Student</small></span><b>⌄</b></button></div></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div><div class="modal-backdrop" id="modalBackdrop"><section class="modal"><button class="modal-close" id="modalClose">×</button><h2 id="modalTitle">Create request</h2><div id="modalBody"></div></section></div></div>
<script src="app.js"></script><script src="auth.js"></script>
</body></html>
